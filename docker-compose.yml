# Compose for the standalone TrustSight triage deployment.
#
# One service: the local-model watcher. It polls the TrustSight feed,
# triages each new alert with the local model, and writes reports, verdicts
# and (for TP) alert.json into the state volume. No opencode, no job
# containers, no docker socket.
#
# The Dockerfile needs all three sibling checkouts in the build context
# (the harness's [tool.uv.sources] expects ../trustsight), so the context
# is the directory that contains them:
#
#   docker compose -f trustsight-triage-agent/docker-compose.yml up -d --build
#
# The model stays on the host (ollama). Compose maps host.docker.internal
# to the host gateway; ollama must listen on 0.0.0.0:11434 and the host
# firewall must allow this container to reach it. See .env.example.

services:
  triage-agent:
    build:
      # Repo parent: contains trustsight/, trustsight-harness/ and
      # trustsight-triage-agent/ as siblings.
      context: ..
      dockerfile: trustsight-triage-agent/Dockerfile
    image: trustsight-triage-agent:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Explicit resolver: on hosts whose /etc/resolv.conf points at a
    # loopback stub (systemd-resolved 127.0.0.53) Docker's embedded DNS
    # forwards to an unreachable target and every lookup fails.
    dns:
      - ${TRIAGE_DOCKER_DNS:-1.1.1.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRIAGE_WORKSPACE: /app
      TRIAGE_STATE_DIR: /var/lib/triage
      TRIAGE_MODEL_BASE_URL: ${TRIAGE_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      TRIAGE_MODEL_NAME: ${TRIAGE_MODEL_NAME:-ornith-9b-agent:latest}
      TRIAGE_MODEL_API_KEY: ${TRIAGE_MODEL_API_KEY:-}
      TRIAGE_INTERVAL: ${TRIAGE_INTERVAL:-300}
      TRIAGE_ALERT: ${TRIAGE_ALERT:-1}
    volumes:
      - triage-state:/var/lib/triage

volumes:
  triage-state:
