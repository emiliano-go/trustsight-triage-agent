# Compose for the triage agent job container.
#
# The Dockerfile needs all three sibling checkouts in the build context
# (the harness's [tool.uv.sources] expects ../trustsight), so the context
# is the directory that contains them. Run from anywhere:
#   docker compose -f trustsight-triage-agent/docker-compose.yml up --build
#
# Egress allowlist (enforced at the network/firewall layer, not by compose;
# document and mirror these in your firewall rules). The container needs to
# reach ONLY:
#   - AUR:            aur.archlinux.org            (agent evidence, verify)
#   - git hosts:      github.com                   (PR open/fetch/backstop)
#                     api.github.com               (PR backstop REST calls)
#   - opencode:       opencode.ai                  (Zen model route)
#   - feed sink:      TRUSTSIGHT_FEED_URL          (dispatcher poll, signed TP alert)
#   - ntfy:           TRUSTSIGHT_NTFY_WEBHOOK host (TP alert)
#   - WARP (opt.):    pkg.cloudflareclient.com at build; warp-svc endpoints
#                     at run time when ENABLE_WARP_ROTATION=1
# Everything else should be denied by the surrounding firewall/egress proxy.

services:
  triage-agent:
    build:
      # Repo parent: contains trustsight/, trustsight-harness/ and
      # trustsight-triage-agent/ as siblings.
      context: ..
      dockerfile: trustsight-triage-agent/Dockerfile
    image: trustsight-triage-agent:latest
    # No `user:` on purpose: the container starts as root so the
    # entrypoint can bootstrap WARP (warp-svc needs root for the TUN
    # device and its state dir) and create the job user's $HOME, then
    # setpriv-drops to the unprivileged `triage` user before exec'ing the
    # command. The job itself never runs as root (docker/entrypoint.sh).
    read_only: true
    tmpfs:
      - /tmp
      # warp-svc keeps its registration state here; on the read-only root
      # it must live on a tmpfs (fresh, anonymous consumer per container).
      - /var/lib/cloudflare-warp
      # warp-svc's control socket lives here.
      - /run
    devices:
      # WARP's wireguard tunnel needs the TUN device; only meaningful
      # when ENABLE_WARP_ROTATION=1.
      - /dev/net/tun:/dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      # Root-bootstrap only: the entrypoint needs to chown the job user's
      # $HOME and setpriv-drop to it; these clear at the drop. NET_ADMIN
      # is for WARP's wireguard tunnel (TUN device), irrelevant (and
      # droppable) when warp rotation is off.
      - CHOWN
      - SETUID
      - SETGID
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      # Set to 1 to start warp-svc in the container and rotate WARP egress
      # between jobs. Left at 0, the container runs on its plain egress.
      ENABLE_WARP_ROTATION: "0"
      TRIAGE_WARP_ROTATION: "true"
      TRIAGE_WARP_MAX_ROTATIONS: "5"
      TRIAGE_POLL_INTERVAL_SECONDS: "120"
      TRIAGE_MODEL: "opencode/MiMo-V2.6-Flash"
      TRIAGE_HARNESS_CLI: "harness"
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      TRUSTSIGHT_FEED_KEY: ${TRUSTSIGHT_FEED_KEY:-}
      TRUSTSIGHT_FEED_KEY_ID: ${TRUSTSIGHT_FEED_KEY_ID:-triage-agent}
      TRUSTSIGHT_FEED_URL: ${TRUSTSIGHT_FEED_URL:-https://watcher.trustsight.org}
      TRUSTSIGHT_NTFY_WEBHOOK: ${TRUSTSIGHT_NTFY_WEBHOOK:-}
    volumes:
      - triage-jobs:/job
    restart: unless-stopped

  # ------------------------------------------------------------------
  # The worker is intentionally NOT defined as a compose service.
  #
  # triage-agent worker spawns one sandboxed container per job through the
  # docker CLI, which requires the docker socket. Mounting
  # /var/run/docker.sock into a container grants that container (and
  # anything that compromises it) full control of the docker host: it can
  # create privileged containers, read any other container's files, and
  # take over the machine. There is no read-only or otherwise safe mode for
  # the docker socket. That is a much weaker security posture than the job
  # sandbox this repo builds everywhere else, so the supported deployment
  # is:
  #
  #   - the DISPATCHER runs containerized (this compose file), and
  #   - the WORKER runs on the docker host itself (a systemd unit, or a
  #     plain process under runit/supervisord) as an unprivileged user,
  #     keeping the queue DB on a host path both processes can reach:
  #
  #       /etc/systemd/system/triage-worker.service:
  #         [Service]
  #         User=triage
  #         EnvironmentFile=-/etc/triage-agent/worker.env
  #         ExecStart=/usr/local/bin/triage-agent-worker worker \
  #             --db /var/lib/triage-agent/triage.sqlite3
  #         Restart=on-failure
  #
  #   Job containers remain fully sandboxed: no host paths, no socket,
  #   read-only rootfs, dropped capabilities, network none (or a
  #   TRIAGE_DOCKER_NETWORK you pre-configure with an egress allowlist).
  #
  # If you accept the socket risk anyway (single-tenant throwaway host),
  # the minimal service would be:
  #
  #   worker:
  #     image: trustsight-triage-agent:latest
  #     command: ["triage-agent", "worker", "--db", "/data/triage.sqlite3"]
  #     volumes:
  #       - /var/run/docker.sock:/var/run/docker.sock   # DANGER: root-equivalent
  #       - triage-queue:/data
  #     # ...same env as triage-agent...
  # ------------------------------------------------------------------

volumes:
  triage-jobs:
  triage-queue:
