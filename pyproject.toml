[project]
name = "trustsight-triage-agent"
version = "0.1.0"
description = "Triage agent: a local model turns TrustSight watcher alerts into cited verdicts and confirmed-IOC alerts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

# The harness and the watcher checkout are external siblings resolved at
# runtime by scripts/local_agent.py; this package stays decoupled from both.
# See README.md.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
