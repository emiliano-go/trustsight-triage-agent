[project]
name = "trustsight-triage-agent"
version = "0.1.0"
description = "Triage agent: turns TrustSight watcher alerts into verified verdicts, PRs, and alerts via the harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
triage-agent = "triage_agent.__main__:main"

# The harness is already installed in the job image and is invoked as the
# `harness` CLI (subprocess), so this repo stays decoupled from the harness
# source tree. See README.md.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
