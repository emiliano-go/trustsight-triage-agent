name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: trustsight-triage-agent
      - name: Lint
        run: uv run ruff check .
        working-directory: trustsight-triage-agent
      - name: Tests
        run: uv run pytest -q
        working-directory: trustsight-triage-agent

  # Isolated from `unit` so a WARP outage never blocks the offline suite.
  # Needs no secrets: it registers an anonymous WARP consumer and checks
  # the egress, then drives the fake-429 rotation path with the unit-test
  # fake warp binary.
  warp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor \
              -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
      - name: Start warp-svc and connect
        run: |
          # No systemd unit is guaranteed on the runner; start the daemon
          # manually exactly like the container entrypoint does.
          sudo sh -c 'warp-svc >/tmp/warp-svc.log 2>&1 &'
          for i in $(seq 1 30); do
            sudo warp-cli status >/dev/null 2>&1 && break
            sleep 1
          done
          sudo warp-cli registration new --accept-terms
          sudo warp-cli connect
          for i in $(seq 1 30); do
            sudo warp-cli status | grep -q 'Status: Connected' && break
            sleep 2
          done
          sudo warp-cli status
      - name: Assert egress is WARP
        run: |
          trace=$(curl -fsSL https://www.cloudflare.com/cdn-cgi/trace)
          echo "$trace"
          echo "$trace" | grep -E '^warp=(plus|on)$'
      - name: Install triage agent (offline tests only)
        run: uv sync --extra dev
        working-directory: trustsight-triage-agent
      - name: Fake-429 rotation path with the unit-test fake warp binary
        working-directory: trustsight-triage-agent
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "tests")
          from test_warp import FAKE_SCRIPT  # noqa: E402

          from triage_agent.rate_limit import RotationPolicy, detect_429
          from triage_agent.warp import WarpManager

          tmp = Path(tempfile.mkdtemp())
          script = tmp / "warp-cli"
          script.write_text(FAKE_SCRIPT)
          script.chmod(0o755)
          os.environ["WARP_FAKE_LOG"] = str(tmp / "calls.log")
          os.environ["WARP_FAKE_CONNECTED_ONCE"] = str(tmp / "once")
          os.environ["WARP_FAKE_MODE"] = "connected"
          os.environ["PATH"] = f"{tmp}:{os.environ['PATH']}"

          # The "HTTP response" that triggered this rotation.
          body = '{"message": "429 Too Many Requests"}'
          assert detect_429(body)
          decision = RotationPolicy(max_rotations=5).decide(
              rate_limited=True, rotations_used=1
          )
          assert decision.action == "rotate", decision

          manager = WarpManager()
          result = manager.rotate()
          assert result.ok, result
          calls = [
              line.split() for line in (tmp / "calls.log").read_text().splitlines()
          ]
          assert ["registration", "delete"] in calls
          assert ["registration", "new", "--accept-terms"] in calls
          assert ["connect"] in calls
          print("fake-429 rotation path OK:", decision.detail)
          PY
